# Host-level edge split. Static content stays available when the BFF is unhealthy.
upstream openakita_web_static {
  server 127.0.0.1:8081;
  keepalive 16;
}

upstream openakita_web_bff {
  server 127.0.0.1:8080;
  keepalive 16;
}

server {
  listen 80;
  server_name openakita.cn www.openakita.cn;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
  }
  location / { return 301 https://openakita.cn$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name openakita.cn;

  ssl_certificate /etc/nginx/ssl/openakita-web/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/openakita-web/key.pem;

  location ^~ /auth/ {
    proxy_pass http://openakita_web_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /account {
    proxy_pass http://openakita_web_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /account/ {
    proxy_pass http://openakita_web_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location ~ ^/api/v1/(session|hub)$ {
    proxy_pass http://openakita_web_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /metrics {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://openakita_web_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://openakita_web_static;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.openakita.cn;
  ssl_certificate /etc/nginx/ssl/openakita-web/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/openakita-web/key.pem;
  return 301 https://openakita.cn$request_uri;
}