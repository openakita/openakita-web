worker_processes auto;
pid /tmp/openakita-nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/openakita-nginx/client_body;
  proxy_temp_path /tmp/openakita-nginx/proxy;
  fastcgi_temp_path /tmp/openakita-nginx/fastcgi;
  uwsgi_temp_path /tmp/openakita-nginx/uwsgi;
  scgi_temp_path /tmp/openakita-nginx/scgi;

  server {
    listen 8081;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # These paths are owned by the BFF. Refuse them here as defense in depth
    # if the static container is reached without the edge proxy.
    location = /account { return 404; }
    location = /account/ { return 404; }
    location ^~ /auth/ { return 404; }
    location ^~ /api/ { return 404; }
    location = /metrics { return 404; }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ $uri/index.html =404;
    }
  }
}
