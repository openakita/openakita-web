# Host-level edge split. Static content stays available when the BFF is unhealthy.
upstream openakita_ai_static {
  server 127.0.0.1:8081;
  keepalive 16;
}

upstream openakita_ai_bff {
  server 127.0.0.1:8080;
  keepalive 16;
}

server {
  listen 80;
  server_name openakita.ai www.openakita.ai;
  return 301 https://openakita.ai$request_uri;
}

server {
  listen 443 ssl http2;
  server_name openakita.ai;

  ssl_certificate /ssl/cert.pem;
  ssl_certificate_key /ssl/cert.key;

  # Web Chat is static; browsers connect directly to the selected provider.
  location ^~ /api/v1/chat/ { return 404; }

  location ^~ /auth/ {
    proxy_pass http://openakita_ai_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /account {
    proxy_pass http://openakita_ai_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /account/ {
    proxy_pass http://openakita_ai_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location ~ ^/api/v1/(session|hub)$ {
    proxy_pass http://openakita_ai_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /metrics {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://openakita_ai_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://openakita_ai_static;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }
}
