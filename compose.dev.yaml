name: openakita-web-dev

services:
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/fzstack/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "63792:6379"
    volumes:
      - web-bff-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  static:
    image: registry.cn-hangzhou.aliyuncs.com/fzstack/openakita-web-static:${APP_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile.static
    ports:
      - "8081:8081"
    restart: unless-stopped

  bff:
    image: registry.cn-hangzhou.aliyuncs.com/fzstack/openakita-web-bff:${APP_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile.bff
    environment:
      WEB_BFF_ENV: development
      WEB_BFF_HTTP_ADDR: :8080
      WEB_BFF_PUBLIC_URL: ${WEB_BFF_PUBLIC_URL:-http://127.0.0.1:8080}
      WEB_BFF_ACCOUNT_ISSUER: ${WEB_BFF_ACCOUNT_ISSUER:-http://host.docker.internal:8088}
      WEB_BFF_ACCOUNT_CLIENT_ID: ${WEB_BFF_ACCOUNT_CLIENT_ID:-openakita-web}
      WEB_BFF_ACCOUNT_CLIENT_SECRET: ${WEB_BFF_ACCOUNT_CLIENT_SECRET:-openakita-web-local-client-secret}
      WEB_BFF_ACCOUNT_REDIRECT_URI: ${WEB_BFF_ACCOUNT_REDIRECT_URI:-http://127.0.0.1:8080/auth/callback}
      WEB_BFF_ACCOUNT_POST_LOGOUT_REDIRECT_URI: ${WEB_BFF_ACCOUNT_POST_LOGOUT_REDIRECT_URI:-http://127.0.0.1:8080/auth/logout/callback}
      WEB_BFF_MARKETPLACE_BASE_URL: ${WEB_BFF_MARKETPLACE_BASE_URL:-http://host.docker.internal:8090/}
      WEB_BFF_MARKETPLACE_MACHINE_ID: ${WEB_BFF_MARKETPLACE_MACHINE_ID:-openakita-web-bff}
      WEB_BFF_MARKETPLACE_MACHINE_SECRET: ${WEB_BFF_MARKETPLACE_MACHINE_SECRET:?WEB_BFF_MARKETPLACE_MACHINE_SECRET is required}
      WEB_BFF_MARKETPLACE_ASSET_ALLOWED_ORIGINS: ${WEB_BFF_MARKETPLACE_ASSET_ALLOWED_ORIGINS:-}
      WEB_BFF_PASS_BASE_URL: ${WEB_BFF_PASS_BASE_URL:-http://host.docker.internal:3000/}
      WEB_BFF_PASS_PUBLIC_URL: ${WEB_BFF_PASS_PUBLIC_URL:-http://127.0.0.1:3000/}
      WEB_BFF_PASS_MACHINE_ID: ${WEB_BFF_PASS_MACHINE_ID:-openakita-web-bff}
      WEB_BFF_PASS_MACHINE_SECRET: ${WEB_BFF_PASS_MACHINE_SECRET:?WEB_BFF_PASS_MACHINE_SECRET is required}
      WEB_BFF_REDIS_URL: redis://redis:6379/0
      WEB_BFF_SESSION_ENCRYPTION_KEYS: ${WEB_BFF_SESSION_ENCRYPTION_KEYS:-local-dev:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      WEB_BFF_SESSION_TTL: ${WEB_BFF_SESSION_TTL:-720h}
      WEB_BFF_ACCOUNT_PAGE_PATH: ../dist/account/index.html
      WEB_BFF_AVATAR_ALLOWED_ORIGINS: ${WEB_BFF_AVATAR_ALLOWED_ORIGINS:-}
      WEB_BFF_TRUSTED_PROXIES: ${WEB_BFF_TRUSTED_PROXIES:-}
      WEB_BFF_AUTH_RATE_LIMIT_PER_MINUTE: ${WEB_BFF_AUTH_RATE_LIMIT_PER_MINUTE:-30}
      WEB_BFF_API_RATE_LIMIT_PER_MINUTE: ${WEB_BFF_API_RATE_LIMIT_PER_MINUTE:-240}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  web-bff-redis:
